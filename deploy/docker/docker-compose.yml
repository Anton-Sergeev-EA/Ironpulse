# ---------------------------------------------------------------------------
# ironpulse — full demo stack: Modbus simulator + engine + nginx front door.
#
# Quickstart:
#   cp .env.example .env      # (only if you need to change a port — the
#                              #  defaults below work out of the box)
#   docker compose up --build
#
# All ports come from .env — see .env.example for what each one does and
# why this is the only file you should need to edit for a local port
# conflict (docs/adr/0003-env-driven-config.md has the full reasoning).
# ---------------------------------------------------------------------------

services:
  simulator:
    build:
      context: ../../tools/modbus_simulator
      dockerfile: Dockerfile
    container_name: ironpulse-simulator
    ports:
      - "${SIMULATOR_PORT:-5020}:5020"
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 5020), timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - ironpulse-net

  ironpulse:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: ironpulse-app
    depends_on:
      simulator:
        condition: service_healthy
    environment:
      # These are the single source of truth for the ports ironpulse binds
      # to inside the container — matched below in `ports:` so the
      # internal and host-visible port numbers can never drift apart.
      IRONPULSE_HTTP_PORT: "${HTTP_PORT:-8080}"
      IRONPULSE_WS_PORT: "${WS_PORT:-8081}"
      IRONPULSE_WORKER_THREADS: "${WORKER_THREADS:-4}"
      IRONPULSE_RETENTION_HOURS: "${RETENTION_HOURS:-168}"
      IRONPULSE_PERSISTENCE_ENABLED: "true"
      IRONPULSE_DATA_DIR: "/app/data"
    ports:
      - "${IRONPULSE_BIND_HOST:-0.0.0.0}:${HTTP_PORT:-8080}:${HTTP_PORT:-8080}"
      - "${IRONPULSE_BIND_HOST:-0.0.0.0}:${WS_PORT:-8081}:${WS_PORT:-8081}"
    volumes:
      - ../config/config.docker.json:/app/config.json:ro
      - ironpulse-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:${HTTP_PORT:-8080}/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - ironpulse-net

  nginx:
    image: nginx:1.27-alpine
    container_name: ironpulse-nginx
    depends_on:
      ironpulse:
        condition: service_healthy
    environment:
      IRONPULSE_HTTP_PORT: "${HTTP_PORT:-8080}"
      IRONPULSE_WS_PORT: "${WS_PORT:-8081}"
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      # nginx:1.27's entrypoint auto-renders any *.template file here
      # through envsubst using the container's environment, so the
      # upstream ports below always match whatever HTTP_PORT/WS_PORT this
      # stack was started with.
      - ../nginx/ironpulse.conf.template:/etc/nginx/templates/default.conf.template:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - ironpulse-net

networks:
  ironpulse-net:
    driver: bridge

volumes:
  ironpulse-data:
