# nginx vhost for ironpulse at https://anton-tests.ru
#
# This is a config for the HOST's own nginx (installed directly on the
# VDS, outside Docker) — NOT the Docker-bundled nginx used for local
# demos (deploy/nginx/ironpulse.conf.template). Use this file when
# ironpulse runs behind an nginx that already serves other sites on the
# same VDS (see deploy/docker/docker-compose.prod.yml, which binds
# ironpulse's ports to 127.0.0.1 so only this vhost can reach it).
#
# Install:
#   sudo cp deploy/nginx/anton-tests.ru.conf /etc/nginx/sites-available/anton-tests.ru
#   sudo ln -s /etc/nginx/sites-available/anton-tests.ru /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Assumes a certificate for anton-tests.ru already exists at the paths
# below (confirmed present via `certbot certificates`, expiring
# 2026-10-12 — renew before then: `sudo certbot renew`).
#
# If you changed HTTP_PORT / WS_PORT away from the defaults (8080/8081)
# in deploy/docker/.env, update the `proxy_pass` targets below to match —
# this file is static and does not read the .env automatically (unlike
# the Docker-bundled nginx template, which does via envsubst).

upstream ironpulse_backend {
    server 127.0.0.1:8080;
}

upstream ironpulse_ws {
    server 127.0.0.1:8081;
}

server {
    listen 80;
    listen [::]:80;
    server_name anton-tests.ru www.anton-tests.ru;

    # Let certbot's HTTP-01 challenge through for renewals; redirect
    # everything else to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # `http2 on;` requires nginx >= 1.25.1 (Debian 13/trixie ships a
    # recent enough version). If `nginx -t` complains about this
    # directive, replace the two `listen` lines above with:
    #   listen 443 ssl http2;
    #   listen [::]:443 ssl http2;
    # and delete the `http2 on;` line below.
    http2 on;
    server_name anton-tests.ru www.anton-tests.ru;

    ssl_certificate     /etc/letsencrypt/live/anton-tests.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anton-tests.ru/privkey.pem;

    # Self-contained modern TLS settings (not relying on
    # /etc/letsencrypt/options-ssl-nginx.conf, which only exists if the
    # certificate was originally issued via `certbot --nginx` — safer to
    # not assume that here).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # REST API + static dashboard
    location / {
        proxy_pass http://ironpulse_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket endpoint for live telemetry push
    location /ws/ {
        proxy_pass http://ironpulse_ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
