name: Release

# Pushing a version tag (git tag v1.0.0 && git push origin v1.0.0) builds the
# engine and simulator images natively for amd64 and arm64 (Raspberry Pi,
# AWS Graviton, industrial ARM gateways), publishes them to GitHub Container
# Registry as one multi-architecture tag, and creates the GitHub release.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: ${{ matrix.image.name }} / ${{ matrix.arch.platform }}
    runs-on: ${{ matrix.arch.runner }}
    strategy:
      fail-fast: true
      matrix:
        arch:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
        image:
          - name: ironpulse
            context: .
            file: deploy/docker/Dockerfile
          - name: ironpulse-simulator
            context: tools/modbus_simulator
            file: tools/modbus_simulator/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: name
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          platforms: ${{ matrix.arch.platform }}
          outputs: type=image,name=${{ steps.name.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.arch.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.arch.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image.name }}-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    name: Publish ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [ironpulse, ironpulse-simulator]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - name: Image name
        id: name
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Create multi-architecture manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ steps.name.outputs.image }}@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect "${{ steps.name.outputs.image }}:${{ steps.meta.outputs.version }}"

  release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "### Docker images (linux/amd64, linux/arm64)"
            echo
            echo '```'
            echo "docker pull ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ironpulse:${version}"
            echo "docker pull ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ironpulse-simulator:${version}"
            echo '```'
          } >> notes.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
